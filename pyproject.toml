[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexttrim"
version = "0.1.0"
description = "Pluggable context window management strategies for LLM agents. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LaVon Rutledge" }
]
keywords = [
    "llm", "ai-agents", "context-window", "token-budget",
    "truncation", "context-management", "prompt", "conversation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []  # Zero external dependencies — pure Python stdlib only

[project.optional-dependencies]
dev = ["pytest", "hatch"]

[project.urls]
Homepage = "https://github.com/aenealabs/contexttrim"
Repository = "https://github.com/aenealabs/contexttrim"
Issues = "https://github.com/aenealabs/contexttrim/issues"
Changelog = "https://github.com/aenealabs/contexttrim/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contexttrim"]

[tool.hatch.envs.default]
dependencies = ["pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest tests/ -v"
